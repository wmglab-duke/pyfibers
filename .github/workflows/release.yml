name: release

# PSR on GitHub only (version, changelog, tag, GitHub Release, PyPI).
# GitHub-hosted runners cannot reach gitlab.oit.duke.edu — GitLab pulls daily.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'Automatically generated by python-semantic-release') }}
    steps:
    - name: Require GH_TOKEN PAT
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        set -euo pipefail
        if [ -z "${GH_TOKEN}" ]; then
          echo "GH_TOKEN secret is required: a PAT that can push to protected main." >&2
          echo "GITHUB_TOKEN is not used; it cannot bypass branch protection." >&2
          exit 1
        fi

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.GH_TOKEN }}

    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Python Semantic Release
      id: release
      uses: python-semantic-release/python-semantic-release@v9.21.1
      with:
        github_token: ${{ secrets.GH_TOKEN }}
        verbosity: '2'

    - name: Publish to PyPI
      if: steps.release.outputs.released == 'true'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        set -euo pipefail
        if [ -z "${TWINE_PASSWORD}" ]; then
          echo "PYPI_TOKEN secret is required to upload to PyPI." >&2
          exit 1
        fi
        python -m pip install twine
        twine upload dist/*
