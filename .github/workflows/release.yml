name: release

# PSR on GitHub only (version, changelog, tag, GitHub Release, PyPI).
# GitHub-hosted runners cannot reach gitlab.oit.duke.edu — GitLab pulls daily.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'Automatically generated by python-semantic-release') }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

    - name: Python Semantic Release
      id: release
      uses: python-semantic-release/python-semantic-release@v9.21.1
      with:
        github_token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        verbosity: '2'

    - name: Publish to PyPI
      if: steps.release.outputs.released == 'true'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        set -euo pipefail
        python -m pip install twine
        twine upload dist/*
