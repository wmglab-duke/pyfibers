# .github/workflows/ci.yml
name: CI

###############################################################################
# Triggers
###############################################################################
on:
  pull_request:            # PRs: lint, tox (+coverage artifacts per Python), docs

  push:
    branches: [main]       # main: same checks + deploy docs

###############################################################################
# Job: Lint with pre-commit hooks
###############################################################################
jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: pyproject.toml
    # Official pre-commit CI cache: default ~/.cache/pre-commit (do not set PRE_COMMIT_HOME;
    # GitHub env does not expand ~). Include python -VV so hook venvs match this interpreter.
    - name: pre-commit cache fingerprint
      run: echo "PY=$(python -VV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
    - uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: pre-commit|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: pre-commit|${{ env.PY }}|
    - run: |
        pip install pre-commit .
        # no-commit-to-branch fails on push-to-main (attached checkout); keep it for local commits only
        SKIP=no-commit-to-branch pre-commit run --all-files
        SKIP=no-commit-to-branch pre-commit run --all-files --hook-stage pre-merge-commit

###############################################################################
# Job: conventional commit messages (PRs only; mirrors GitLab commitizen)
###############################################################################
  commitizen:
    name: commitizen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Check commits since base
      run: |
        pip install commitizen
        cz check --rev-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

###############################################################################
# Job: flake8-fixme check
###############################################################################
  fixme:
    name: flake8-fixme
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: pyproject.toml
    - run: |
        pip install flake8 flake8-fixme
        flake8 --select T100,T101,T102 src/

###############################################################################
# Path filter: tox/coverage only when test-related paths change (mirrors GitLab)
###############################################################################
  tox-paths:
    name: tox path filter
    runs-on: ubuntu-latest
    outputs:
      tox: ${{ steps.filter.outputs.tox }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          tox:
            - 'src/**'
            - 'tests/**'
            - 'tox.ini'
            - 'pyproject.toml'
            - '.github/workflows/ci.yml'
            - '.github/workflows/tox-matrix.yml'

###############################################################################
# Job-set: test matrix (includes py313+coverage; artifacts only from 3.13)
# Always invoked so the four cells post a status (real run or no-op).
###############################################################################
  test:
    name: tox matrix
    needs: [pre-commit, fixme, tox-paths]
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/tox-matrix.yml
    with:
      noop: ${{ needs.tox-paths.outputs.tox != 'true' }}

###############################################################################
# Job: build docs + linkcheck (reusable; pages artifact only on main push)
###############################################################################
  docs:
    name: build docs
    needs: [pre-commit, fixme]
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    uses: ./.github/workflows/docs.yml
    with:
      upload_pages_artifact: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

###############################################################################
# Job: Deploy to GitHub Pages  (main push only; wait for lint + tox like GitLab)
###############################################################################
  deploy-pages:
    name: deploy pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: [docs, pre-commit, fixme, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5

###############################################################################
# Job: semantic-release + PyPI (main push only; after lint, tox, docs, pages)
###############################################################################
  release:
    name: semantic-release
    needs: [docs, pre-commit, fixme, test, deploy-pages]
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'Automatically generated by python-semantic-release')
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
