# .github/workflows/ci.yml
name: CI

###############################################################################
# Triggers
###############################################################################
on:
  pull_request:            # PRs: lint, tox, coverage, docs (no pages deploy)
  push:
    branches: [main]       # main: same checks + deploy docs

###############################################################################
# Global settings
###############################################################################
env:
  PIP_CACHE_DIR: ~/.cache/pip
  PRE_COMMIT_HOME: ~/.cache/pre-commit

###############################################################################
# Job: Lint with pre-commit hooks
###############################################################################
jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
    - run: |
        pip install pre-commit .
        pre-commit run --all-files
        pre-commit run --all-files --hook-stage pre-merge-commit

###############################################################################
# Job: conventional commit messages (PRs only; mirrors GitLab commitizen)
###############################################################################
  commitizen:
    name: commitizen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
    - name: Check commits since base
      run: |
        pip install commitizen
        cz check --rev-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

###############################################################################
# Job: flake8-fixme check
###############################################################################
  fixme:
    name: flake8-fixme
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
    - run: |
        pip install flake8 flake8-fixme
        flake8 --select T100,T101,T102 src/

###############################################################################
# Job-set: test matrix (reusable; py313 owned by coverage job)
###############################################################################
  test:
    name: tox matrix
    needs: [pre-commit, fixme]
    uses: ./.github/workflows/tox-matrix.yml

###############################################################################
# Job: coverage (py313-neuron9,coverage) — mirrors GitLab tox_coverage
###############################################################################
  coverage:
    name: coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
    - run: |
        pip install tox
        tox r -e py313-neuron9,coverage
    - uses: actions/upload-artifact@v7
      with:
        name: coverage-html
        path: coverage_html_report

###############################################################################
# Job: build docs + linkcheck (reusable; pages artifact only on main push)
###############################################################################
  docs:
    name: build docs
    needs: pre-commit
    uses: ./.github/workflows/docs.yml
    with:
      upload_pages_artifact: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

###############################################################################
# Job: Deploy to GitHub Pages  (runs only on main push)
###############################################################################
  deploy-pages:
    name: deploy pages
    environment:
      name: github-pages
    needs: docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5
