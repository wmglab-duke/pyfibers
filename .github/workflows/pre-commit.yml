# Lint on GHA (Python 3.13) and autofix PRs with pre-commit.ci lite.
# Single-job workflow: lite requires this job to be alone or last to finish.
name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - run: pip install .
    - uses: pre-commit/action@v3.0.1
      env:
        SKIP: no-commit-to-branch
      with:
        extra_args: --all-files
    - uses: pre-commit-ci/lite-action@v1.1.0
      if: always() && github.event_name == 'pull_request'
      with:
        msg: 'style: apply automatic fixes'
