# Reusable Sphinx HTML + linkcheck (CI and weekly maintenance).
name: Docs

on:
  workflow_call:
    inputs:
      upload_pages_artifact:
        description: Upload GitHub Pages artifact (main push only)
        type: boolean
        default: false

jobs:
  docs:
    name: build docs + linkcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: pyproject.toml
    - uses: actions/cache@v6
      with:
        # Must match nb_execution_cache_path in docs/source/conf.py.
        path: docs/.jupyter_cache
        # No restore-keys: Myst-NB skips re-execution if a stale cache is restored
        # after src/ or dependency changes (it only hashes notebook contents).
        key: jupyter-${{ hashFiles('docs/**/*.ipynb', 'docs/source/conf.py', 'pyproject.toml', 'src/pyfibers/**') }}
    - name: System packages
      run: |
        sudo apt-get update
        sudo apt-get -y install libgl1 pandoc
    - name: Build HTML and linkcheck
      run: |
        pip install --upgrade pip ipython ipykernel
        pip install ".[dev,docs]"
        pip install neuron
        pyfibers_compile
        python -m ipykernel install --name "python3" --user
        sphinx-build -W -b html docs/source public
        sphinx-build -b linkcheck docs/source docs/build/linkcheck
    - uses: actions/upload-pages-artifact@v5
      if: inputs.upload_pages_artifact
      with:
        path: public
