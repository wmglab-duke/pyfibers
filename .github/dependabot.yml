# Keep Actions, Python deps, and pre-commit hooks current via weekly PRs.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5

- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5

- package-ecosystem: pre-commit
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
