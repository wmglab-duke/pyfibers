# Keep Actions, Python deps, and pre-commit hooks current via weekly PRs.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  ignore:
  # newer versions of python-semantic-release don't respect allow_zero control
  - dependency-name: python-semantic-release/python-semantic-release

- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  ignore:
  # newer versions of numpy break GitLab CI
  - dependency-name: numpy
  # Sphinx 9 breaks enum-tools; stay on 8.x until fixed upstream
  - dependency-name: sphinx

- package-ecosystem: pre-commit
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
