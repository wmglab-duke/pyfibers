# Keep Actions, Python deps, and pre-commit hooks current via weekly PRs.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5

- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  ignore:
  # Sphinx 9 breaks enum-tools; stay on 8.x until fixed upstream
  - dependency-name: sphinx

- package-ecosystem: pre-commit
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
