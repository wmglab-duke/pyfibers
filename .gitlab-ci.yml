default:
  image: python:3.13

# Variables (Settings → CI/CD → Variables; Masked=on, Protected=off for MR visibility):
#   GH_TOKEN         — GitHub PAT: contents, pull_requests, workflows (read/write)
#   GITLAB_API_TOKEN — GitLab PAT: Merge Request write + Code write (promote close + daily sync)
#
# Daily sync schedule (required): Build → Pipeline schedules → cron "0 0 * * *" (midnight UTC)
#   Target branch: main, Activated: on

workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" #run on mr
  - if: $CI_PIPELINE_SOURCE == "schedule" # daily sync from GitHub
  - if: $CI_PIPELINE_SOURCE == "web" # manual pipelines (sync play button)
  - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS #don't run duplicate pipelines for MR
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH #run on main
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS != "true" #don't run on push if no MR for this branch
    when: never
  - if: $CI_COMMIT_REF_PROTECTED #run on protected branches

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  PRE_COMMIT_HOME: $CI_PROJECT_DIR/.cache/pre-commit
  GITHUB_REPO: wmglab-duke/pyfibers

# Pip's cache doesn't store the python packages
# https://pip.pypa.io/en/stable/topics/caching/
#
# If you want to also cache the installed packages, you have to install
# them in a virtualenv and cache it as well.

stages:
- lint
- test
- mirror
- sync
- deploy

cache:
  paths:
  - ${PIP_CACHE_DIR}
  - ${PRE_COMMIT_HOME}
  - venv/
  - .jupyter_cache

### LINTING STAGE

before_script:
- python --version
- pip install virtualenv
- virtualenv venv
- source venv/bin/activate

# Skip lint/test/pages on schedule/web (those pipelines are sync-only).
.ci_rules: &ci_rules
- if: $CI_PIPELINE_SOURCE == "schedule"
  when: never
- if: $CI_PIPELINE_SOURCE == "web"
  when: never
- if: $CI_PIPELINE_SOURCE == "merge_request_event"
- if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Tox / coverage: run when test-related paths change; otherwise no-op succeed
# so open_github_pr can unlock (skipped≠failed; failed still blocks promote).
.tox_changes: &tox_changes
- src/**/*
- tests/**/*
- tox.ini
- pyproject.toml
- .gitlab-ci.yml

.tox_rules: &tox_rules
- if: $CI_PIPELINE_SOURCE == "schedule"
  when: never
- if: $CI_PIPELINE_SOURCE == "web"
  when: never
- if: $CI_PIPELINE_SOURCE == "merge_request_event"
  changes: *tox_changes
- if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  changes: *tox_changes
- if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    TOX_NOOP: '1'
- if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    TOX_NOOP: '1'

pre-commit:
  stage: lint
  script:
  - pip install pre-commit .
  - pre-commit run --all-files
  - pre-commit run --all-files --hook-stage pre-merge-commit
  rules: *ci_rules

commitizen:
  stage: lint
  script:
  - pip install commitizen
  - cz check --rev-range "$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA"
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"

fixme:
  stage: lint
  script:
  - pip install flake8 flake8-fixme
  - flake8 --select T100,T101,T102 src/
  rules: *ci_rules

### TESTING STAGE
# Matrix matches .github/workflows/tox-matrix.yml (cobertura from every cell).
tox:
  stage: test
  image: python:${PYTHON_VERSION}
  parallel:
    matrix:
    - PYTHON_VERSION: '3.11'
      TOX_ENV: py311-neuron8
    - PYTHON_VERSION: '3.12'
      TOX_ENV: py312-neuron9
    - PYTHON_VERSION: '3.13'
      TOX_ENV: py313-neuron9
    - PYTHON_VERSION: '3.14'
      TOX_ENV: py314-neuron9
  before_script:
  - python --version
  script:
  - |
    if [ "${TOX_NOOP:-}" = "1" ]; then
      echo "No tox-related path changes; skipping ${TOX_ENV}."
      mkdir -p coverage_html_report
      : > coverage.xml
      exit 0
    fi
  - pip install tox
  - tox -l
  - tox r -e ${TOX_ENV}
  - tox exec -e ${TOX_ENV} -- coverage report
  - tox exec -e ${TOX_ENV} -- coverage xml
  - tox exec -e ${TOX_ENV} -- coverage html
  coverage: /(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  artifacts:
    paths:
    - coverage_html_report/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    when: on_success
  rules: *tox_rules

# Define the build_docs script as an anchor (HTML then external linkcheck;
# sphinx-build exits non-zero if linkcheck finds broken or timed-out links).
.build_docs: &build_docs
- apt-get update && apt-get -y install libgl1
- pip install --upgrade pip ipython ipykernel
- pip install ".[dev,docs]"
- pip install neuron
- pyfibers_compile
- apt-get install -y pandoc
- ipython kernel install --name "python3" --user
- sphinx-build -W -b html docs/source public
- sphinx-build -b linkcheck docs/source docs/build/linkcheck

# Docs + linkcheck on MRs (and non-default branches). Pages deploy is separate.
test_docs:
  stage: test
  script:
  - *build_docs
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_PIPELINE_SOURCE == "web"
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

### MIRROR STAGE (GitHub is the merge target)

# Play button on the MR pipeline: open/update GitHub PR, then close this MR.
# Do NOT use GitLab Merge into main.
open_github_pr:
  stage: mirror
  needs:
  - pre-commit
  - commitizen
  - fixme
  - tox
  - test_docs
  image:
    name: maniator/gh:latest
    entrypoint: ['']
  before_script: []
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: manual
    allow_failure: true
  script:
  - |
    set -euo pipefail
    test -n "${GH_TOKEN:-}" || {
      echo "GH_TOKEN is required (GitHub PAT: contents, pull_requests, workflows)." >&2
      echo "Uncheck Protected on the variable so MR pipelines can see it." >&2
      exit 1
    }
    test -n "${GITLAB_API_TOKEN:-}" || {
      echo "GITLAB_API_TOKEN is required (GitLab PAT: Merge Request write) to close this MR after promote." >&2
      echo "Uncheck Protected on the variable so MR pipelines can see it." >&2
      exit 1
    }
    export GH_TOKEN
    if command -v apk >/dev/null 2>&1; then
      apk add --no-cache curl git >/dev/null
    elif command -v apt-get >/dev/null 2>&1; then
      apt-get update -qq && apt-get install -y -qq curl git >/dev/null
    fi

    GH_BRANCH="gitlab/mr-${CI_MERGE_REQUEST_IID}"
    GH_REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPO}.git"
    git remote remove github 2>/dev/null || true
    git remote add github "${GH_REMOTE_URL}"

    if git ls-remote --exit-code --heads github "${GH_BRANCH}" >/dev/null 2>&1; then
      git fetch github "refs/heads/${GH_BRANCH}"
      REMOTE_SHA="$(git rev-parse FETCH_HEAD)"
      LOCAL_SHA="$(git rev-parse HEAD)"
      if [ "${REMOTE_SHA}" = "${LOCAL_SHA}" ]; then
        echo "GitHub ${GH_BRANCH} already at ${LOCAL_SHA}"
      elif git merge-base --is-ancestor "${REMOTE_SHA}" "${LOCAL_SHA}"; then
        git push github "HEAD:refs/heads/${GH_BRANCH}"
      else
        git push --force-with-lease="refs/heads/${GH_BRANCH}:${REMOTE_SHA}" \
          github "HEAD:refs/heads/${GH_BRANCH}"
      fi
    else
      git push github "HEAD:refs/heads/${GH_BRANCH}"
    fi

    BODY="$(printf 'Mirrored from GitLab MR !%s (branch %s)\n\n%s\n\n---\nSource: %s/-/merge_requests/%s' \
      "${CI_MERGE_REQUEST_IID}" \
      "${CI_COMMIT_REF_NAME}" \
      "${CI_MERGE_REQUEST_DESCRIPTION}" \
      "${CI_PROJECT_URL}" \
      "${CI_MERGE_REQUEST_IID}")"

    PR_NUMBER="$(gh pr list --repo "${GITHUB_REPO}" --head "${GH_BRANCH}" --state open --json number --jq '.[0].number // empty')"
    if [ -n "${PR_NUMBER}" ]; then
      gh pr edit "${PR_NUMBER}" --repo "${GITHUB_REPO}" \
        --title "${CI_MERGE_REQUEST_TITLE}" --body "$BODY"
    else
      gh pr create --repo "${GITHUB_REPO}" \
        --base main --head "${GH_BRANCH}" \
        --title "${CI_MERGE_REQUEST_TITLE}" --body "$BODY"
    fi

    PR_URL="$(gh pr list --repo "${GITHUB_REPO}" --head "${GH_BRANCH}" --state open --json url --jq '.[0].url')"
    echo "GitHub PR: ${PR_URL}"

    AUTH_HEADER="PRIVATE-TOKEN: ${GITLAB_API_TOKEN}"
    curl --fail-with-body -sS -X POST \
      -H "${AUTH_HEADER}" \
      -H "Content-Type: application/json" \
      --data "$(printf '{"body":"Promoted to GitHub for merge: %s\\n\\nClosing this MR without merging. Merge on GitHub; GitLab main syncs daily."}' "${PR_URL}")" \
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
    curl --fail-with-body -sS -X PUT \
      -H "${AUTH_HEADER}" \
      -H "Content-Type: application/json" \
      --data '{"state_event":"close"}' \
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}"
    echo "Closed GitLab MR !${CI_MERGE_REQUEST_IID} without merging."

### SYNC STAGE (GitHub → GitLab; GitHub-hosted runners cannot reach Duke GitLab)

# Create schedule: Build → Pipeline schedules → cron "0 0 * * *" (midnight UTC).
sync_from_github:
  stage: sync
  # alpine/git ENTRYPOINT is `git`; clear it so the runner can invoke `sh`.
  image:
    name: alpine/git:latest
    entrypoint: ['']
  before_script: []
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: '0'
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
  - if: $CI_PIPELINE_SOURCE == "web"
    when: manual
    allow_failure: true
  script:
  - |
    set -euo pipefail
    test -n "${GH_TOKEN:-}" || { echo "GH_TOKEN is required to fetch GitHub" >&2; exit 1; }
    test -n "${GITLAB_API_TOKEN:-}" || {
      echo "GITLAB_API_TOKEN is required to push to GitLab main (Code write)." >&2
      exit 1
    }

    apk add --no-cache bash >/dev/null
    git config --global user.email "ci@${CI_SERVER_HOST}"
    git config --global user.name "gitlab-sync-from-github"

    git remote remove github 2>/dev/null || true
    git remote add github "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPO}.git"
    git fetch github main --tags

    # Runner checks out CI_COMMIT_SHA as a detached HEAD (GIT_CHECKOUT=true),
    # so refs/heads/${CI_DEFAULT_BRANCH} is usually absent. Prefer the live
    # origin tip when present; fall back to the pipeline commit.
    # https://docs.gitlab.com/ci/runners/configure_runners/#git-checkout
    git fetch origin "${CI_DEFAULT_BRANCH}"
    LOCAL_SHA="$(git rev-parse --verify "refs/remotes/origin/${CI_DEFAULT_BRANCH}" 2>/dev/null \
      || git rev-parse --verify "${CI_COMMIT_SHA}")"
    REMOTE_SHA="$(git rev-parse --verify refs/remotes/github/main)"
    echo "GitLab ${CI_DEFAULT_BRANCH}=${LOCAL_SHA}"
    echo "GitHub main=${REMOTE_SHA}"

    PUSH_URL="https://oauth2:${GITLAB_API_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

    if [ "${LOCAL_SHA}" = "${REMOTE_SHA}" ]; then
      echo "Branch already up to date; pushing any missing tags."
    else
      if ! git merge-base --is-ancestor "${LOCAL_SHA}" "${REMOTE_SHA}"; then
        echo "Refusing non-fast-forward update. Reset GitLab main manually if intentional." >&2
        exit 1
      fi
      git push "${PUSH_URL}" "refs/remotes/github/main:refs/heads/${CI_DEFAULT_BRANCH}"
    fi

    git push "${PUSH_URL}" --tags
    echo "Synced GitHub main → GitLab ${CI_DEFAULT_BRANCH} and tags."

### DEPLOY STAGE

pages:
  stage: deploy
  script:
  - *build_docs
  artifacts:
    paths:
    - public
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_PIPELINE_SOURCE == "web"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
